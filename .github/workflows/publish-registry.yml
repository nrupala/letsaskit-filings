name: publish-registry

# Publishes the connector metadata to the official MCP registry
# (registry.modelcontextprotocol.io) whenever a version tag (v*) is pushed.
#
# Auth: GitHub OIDC. The io.github.nrupala/* namespace is proven by this
# repo's own OIDC identity — no secrets, no browser device flow, no owner
# action. Registry versions are immutable, so each release gets its own tag.
#
# Retries: re-run via workflow_dispatch, or delete + re-push the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the github-oidc login
    steps:
      - uses: actions/checkout@v4

      - name: install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: validate server.json
        run: mcp-publisher validate
        working-directory: .

      - name: login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: publish to MCP registry
        run: mcp-publisher publish server.json

      - name: verify listing
        run: |
          sleep 20
          curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=letsaskit" | head -c 2000
          echo
